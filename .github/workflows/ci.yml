name: solvable
on: [push, pull_request]

jobs:
  solve-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Start lab
        run: |
          python app.py > server.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:5000/ >/dev/null && break; sleep 1; done
      - name: Every challenge must be solvable
        run: python solutions/solve_all.py --submit
      - if: failure()
        run: cat server.log
